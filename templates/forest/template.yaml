  background: "#06100b"
  wall_color: "#2c3e28"
  wall_trim: "#5c7a48"
  floor_primary: "#17231b"
  floor_secondary: "#1c2b21"
  floor_accent: "#141f18"
  grid_line: "rgba(52, 211, 153, 0.05)"
  accent_color: "#34d399"
  secondary_color: "#facc15"
  spawn_effect: "portal"
  spawn_color: "#34d399"
  particles: "fireflies"
  exterior: "forest"
  working_verb: "Channelling sylvan World-Tree lore"
  idle_verb: "Resting in the moonlit fairy glade"

