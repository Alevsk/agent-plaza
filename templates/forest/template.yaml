id: forest
name: "Sylvan World-Tree & Elven Grove"
description: "Moonlit elven sanctuary inside the living World-Tree where agents scry starlight moonwells, weave bioluminescent mushroom spores, brew sun-dew nectar, and commune around the fairy pond."
theme_badge: "🌲 Forest"

