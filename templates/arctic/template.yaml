  - { id: "prop-stove",      type: "arctic_hearth_stove", col: 23, row: 2,  w: 2, h: 1, label: "HEARTH", animated: true }
  - { id: "prop-hot-spring", type: "arctic_hot_spring",   col: 18, row: 4,  w: 4, h: 2, label: "HOT SPRING", animated: true }
  - { id: "prop-ice-vault",  type: "arctic_ice_vault",    col: 25, row: 11, w: 2, h: 2, label: "ICE CORE VAULT" }
  - { id: "prop-gear-rack",  type: "arctic_snowcat_rack", col: 25, row: 14, w: 2, h: 2, label: "POLAR GEAR" }
  - { id: "prop-aurora-map", type: "arctic_aurora_map",   col: 4,  row: 0,  w: 4, h: 1, label: "AURORA FORECAST" }
  - { id: "prop-pine-1",     type: "arctic_frost_pine",   col: 11, row: 1,  w: 1, h: 1 }
  - { id: "prop-pine-2",     type: "arctic_frost_pine",   col: 26, row: 1,  w: 1, h: 1 }
  - { id: "prop-pine-3",     type: "arctic_frost_pine",   col: 1,  row: 16, w: 1, h: 1 }

