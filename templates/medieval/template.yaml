  - { id: "tome-14", label: "Illuminated Manuscript Lectern", col: 19, row: 11, seat_col: 19, seat_row: 12, facing: "up", style: "medieval_scribe",     glow_color: "#f59e0b" }
  - { id: "tome-15", label: "Star-Chart Telescope Desk",      col: 22, row: 11, seat_col: 22, seat_row: 12, facing: "up", style: "medieval_astrolabe",  glow_color: "#a855f7" }
  - { id: "tome-16", label: "Elder Scroll Quill & Candle",    col: 16, row: 14, seat_col: 16, seat_row: 15, facing: "up", style: "medieval_scribe",     glow_color: "#10b981" }
  - { id: "tome-17", label: "Planetary Orrery Mechanism",     col: 19, row: 14, seat_col: 19, seat_row: 15, facing: "up", style: "medieval_astrolabe",  glow_color: "#ef4444" }
