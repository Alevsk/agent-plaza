id: medieval
name: "Arcane Citadel & Practice Courtyard"
description: "Medieval castle keep where agents brew potions in bubbling cauldrons, hammer runeblades at the dwarven forge, enchant crystals, illuminate manuscripts, and train at the archery range & combat courtyard."
theme_badge: "🏰 Medieval"

theme:
  background: "#0d0907"
  wall_color: "#332922"
  wall_trim: "#85684a"
  floor_primary: "#2a221c"
  floor_secondary: "#382d25"
  floor_accent: "#5c1d24"
  grid_line: "rgba(245, 158, 11, 0.05)"
  accent_color: "#f59e0b"
  secondary_color: "#ef4444"
  spawn_effect: "portal"
  spawn_color: "#f59e0b"
  particles: "embers"
  working_verb: "Crafting in the citadel"
  idle_verb: "Training in the archery courtyard"

