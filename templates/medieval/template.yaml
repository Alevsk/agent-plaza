    label: "ALCHEMY & APOTHECARY LAB"
    color: "#10b981"
    col: 1
    row: 1
    w: 11
    h: 7
  - id: "runeforge"
    label: "DWARVEN RUNEFORGE & ARMORY"
    color: "#ef4444"
    col: 1
    row: 10
    w: 11
    h: 7
  - id: "astrolabe"
    label: "SCRIPTORIUM & ASTROLABE TOWER"
