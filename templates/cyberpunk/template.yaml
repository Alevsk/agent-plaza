    label: "DEEP-DIVE NETRUNNER PODS"
    color: "#00f0ff"
    col: 1
    row: 1
    w: 11
    h: 7
  - id: "ripperdoc_clinic"
    label: "RIPPERDOC CYBERWARE CLINIC"
    color: "#ff007f"
    col: 1
    row: 10
    w: 11
    h: 7
  - id: "drone_foundry"
    label: "DRONE & HOLO-SYNTH FOUNDRY"
    color: "#a855f7"
    col: 14
    row: 10
    w: 13
    h: 7
  - id: "neon_bar"
    label: "NEON RAMEN STALL & BRAINDANCE"
    color: "#facc15"
    col: 14
    row: 1
    w: 13
    h: 7

