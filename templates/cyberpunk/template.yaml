  - { id: "deck-2",  label: "3D Holographic Globe Pillar",   col: 5,  row: 2,  seat_col: 5,  seat_row: 3,  facing: "up", style: "cyber_holo_pillar",     glow_color: "#ff007f" }
  - { id: "deck-3",  label: "Triple-Visor Hacker Deck",      col: 8,  row: 2,  seat_col: 8,  seat_row: 3,  facing: "up", style: "cyber_deck_triple",     glow_color: "#a855f7" }
  - { id: "deck-4",  label: "Blackwall Breach Chair",        col: 2,  row: 5,  seat_col: 2,  seat_row: 6,  facing: "up", style: "cyber_netrunner_chair", glow_color: "#facc15" }
  - { id: "deck-5",  label: "Modular Synth Frequency Rack",  col: 5,  row: 5,  seat_col: 5,  seat_row: 6,  facing: "up", style: "cyber_synth_rack",      glow_color: "#00f0ff" }
  - { id: "deck-6",  label: "Orbital Holo-Projector",        col: 8,  row: 5,  seat_col: 8,  seat_row: 6,  facing: "up", style: "cyber_holo_pillar",     glow_color: "#ff007f" }
  # South Ripperdoc Cyberware Clinic
