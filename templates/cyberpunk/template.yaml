  - { id: "deck-8",  label: "Optical Implant Laser Rig",     col: 5,  row: 11, seat_col: 5,  seat_row: 12, facing: "up", style: "cyber_ripperdoc",       glow_color: "#22c55e" }
  - { id: "deck-9",  label: "Cyber-Katana Calibration Deck", col: 8,  row: 11, seat_col: 8,  seat_row: 12, facing: "up", style: "cyber_deck_triple",     glow_color: "#ff007f" }
  - { id: "deck-10", label: "Neural Cortex Splicer",         col: 2,  row: 14, seat_col: 2,  seat_row: 15, facing: "up", style: "cyber_netrunner_chair", glow_color: "#a855f7" }
  - { id: "deck-11", label: "Chrome Prosthetics Workbench",  col: 5,  row: 14, seat_col: 5,  seat_row: 15, facing: "up", style: "cyber_ripperdoc",       glow_color: "#00f0ff" }
  - { id: "deck-12", label: "Sub-dermal Armor Forge",        col: 8,  row: 14, seat_col: 8,  seat_row: 15, facing: "up", style: "cyber_synth_rack",      glow_color: "#facc15" }
  # East Drone & Holo-Synth Foundry
  - { id: "deck-13", label: "Combat Drone Assembly Rig",     col: 16, row: 11, seat_col: 16, seat_row: 12, facing: "up", style: "cyber_drone_rig",       glow_color: "#00f0ff" }
  - { id: "deck-14", label: "Holo-Architecture Pillar",      col: 19, row: 11, seat_col: 19, seat_row: 12, facing: "up", style: "cyber_holo_pillar",     glow_color: "#ff007f" }
  - { id: "deck-15", label: "Swarm Telemetry Rig",           col: 22, row: 11, seat_col: 22, seat_row: 12, facing: "up", style: "cyber_drone_rig",       glow_color: "#a855f7" }
  - { id: "deck-16", label: "AI Signal Decryption Synth",    col: 16, row: 14, seat_col: 16, seat_row: 15, facing: "up", style: "cyber_synth_rack",      glow_color: "#22c55e" }
  - { id: "deck-17", label: "Micro-Bot Soldering Station",   col: 19, row: 14, seat_col: 19, seat_row: 15, facing: "up", style: "cyber_drone_rig",       glow_color: "#00f0ff" }
