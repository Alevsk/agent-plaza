id: cyberpunk
name: "Neo-Tokyo Netrunner Lab"
description: "High-tech cyberpunk enclave with neural dive chairs, ripperdoc cyberware benches, 3D holo-pillars, drone assembly rigs, and a neon street ramen bar & cryo lounge."
theme_badge: "🌃 Cyberpunk"

theme:
  background: "#06040f"
  wall_color: "#181030"
  wall_trim: "#00f0ff"
  floor_primary: "#0f0b1f"
  floor_secondary: "#17112e"
  floor_accent: "#281147"
  grid_line: "rgba(0, 240, 255, 0.08)"
  accent_color: "#00f0ff"
  secondary_color: "#ff007f"
  spawn_effect: "beam"
  spawn_color: "#00f0ff"
  particles: "neon"
  working_verb: "Jacked into Cyberspace"
  idle_verb: "Chilling at the Neon Ramen Bar"

grid:
  cols: 28
  rows: 18
  tile_size: 16
  layout:
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "W..........................W"
    - "W..........................W"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"

zones:
