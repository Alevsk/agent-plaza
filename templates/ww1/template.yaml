id: ww1
name: "Western Front Trench & Dugout HQ"
description: "Candle-lit WW1 timber dugout and sandbagged fire-step trench where agents scan No Man's Land through box periscopes, crank field telephones, dispatch Cher Ami carrier pigeons, plot sector maps, and warm up by the coke brazier and brass gramophone."
theme_badge: "🪖 WW1 Trenches"

theme:
  background: "#0c0a08"
  wall_color: "#4a3b2a"
  wall_trim: "#786242"
  floor_primary: "#1e1914"
  floor_secondary: "#261f18"
  floor_accent: "#211b15"
  grid_line: "rgba(217, 119, 6, 0.05)"
  accent_color: "#f59e0b"
  secondary_color: "#84cc16"
  spawn_effect: "smoke"
  spawn_color: "#f59e0b"
  particles: "embers"
  working_verb: "Holding the Western Front trench line"
  idle_verb: "Resting by the dugout brazier & gramophone"

grid:
  cols: 28
  rows: 18
  tile_size: 16
  layout:
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "W..........................W"
    - "W..........................W"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"

zones:
  - id: "fire_step_parapet"
    label: "FIRE-STEP PERISCOPE & VICKERS LINE"
    color: "#f59e0b"
    col: 1
    row: 1
    w: 11
    h: 7
  - id: "signals_dugout"
    label: "FIELD TELEPHONE & CARRIER PIGEON LOFT"
    color: "#84cc16"
    col: 1
    row: 10
    w: 11
    h: 7
  - id: "command_dugout"
    label: "SECTOR MAP DUGOUT & RFC BIPLANE RECON"
    color: "#eab308"
    col: 14
    row: 10
    w: 13
    h: 7
  - id: "mess_brazier"
    label: "OFFICERS' BRAZIER & GRAMOPHONE DUGOUT"
    color: "#ef4444"
    col: 14
    row: 1
    w: 13
    h: 7

workstations:
  # North Fire-Step Periscope & Vickers Line
  - { id: "w1-1",  label: "Fire-Step Box Periscope Post",     col: 2,  row: 2,  seat_col: 2,  seat_row: 3,  facing: "up", style: "ww1_periscope_post",  glow_color: "#f59e0b" }
  - { id: "w1-2",  label: "Water-Cooled Vickers MG Nest",     col: 5,  row: 2,  seat_col: 5,  seat_row: 3,  facing: "up", style: "ww1_vickers_post",    glow_color: "#ef4444" }
  - { id: "w1-3",  label: "No Man's Land Rangefinder Post",   col: 8,  row: 2,  seat_col: 8,  seat_row: 3,  facing: "up", style: "ww1_periscope_post",  glow_color: "#eab308" }
  - { id: "w1-4",  label: "Lewis Gun Sandbag Embrasure",      col: 2,  row: 5,  seat_col: 2,  seat_row: 6,  facing: "up", style: "ww1_vickers_post",    glow_color: "#f97316" }
  - { id: "w1-5",  label: "Trench Flare & Whistle Watch",     col: 5,  row: 5,  seat_col: 5,  seat_row: 6,  facing: "up", style: "ww1_periscope_post",  glow_color: "#84cc16" }
  - { id: "w1-6",  label: "Forward Observation Periscope",    col: 8,  row: 5,  seat_col: 8,  seat_row: 6,  facing: "up", style: "ww1_periscope_post",  glow_color: "#38bdf8" }
  # South Field Telephone & Carrier Pigeon Loft
  - { id: "w1-7",  label: "D-III Crank Field Telephone Desk", col: 2,  row: 11, seat_col: 2,  seat_row: 12, facing: "up", style: "ww1_field_telephone", glow_color: "#f59e0b" }
  - { id: "w1-8",  label: "Cher Ami Carrier Pigeon Loft",     col: 5,  row: 11, seat_col: 5,  seat_row: 12, facing: "up", style: "ww1_pigeon_coop",     glow_color: "#84cc16" }
  - { id: "w1-9",  label: "Fullerphone Trench Telegraph",     col: 8,  row: 11, seat_col: 8,  seat_row: 12, facing: "up", style: "ww1_field_telephone", glow_color: "#eab308" }
  - { id: "w1-10", label: "Messenger Pigeon Capsule Bench",   col: 2,  row: 14, seat_col: 2,  seat_row: 15, facing: "up", style: "ww1_pigeon_coop",     glow_color: "#22c55e" }
  - { id: "w1-11", label: "Buried Copper Cable Switchboard",  col: 5,  row: 14, seat_col: 5,  seat_row: 15, facing: "up", style: "ww1_field_telephone", glow_color: "#f97316" }
  - { id: "w1-12", label: "Battalion Runner Dispatch Desk",   col: 8,  row: 14, seat_col: 8,  seat_row: 15, facing: "up", style: "ww1_pigeon_coop",     glow_color: "#facc15" }
  # East Sector Map Dugout & RFC Biplane Recon
  - { id: "w1-13", label: "Ypres Salient Candle Map Table",   col: 16, row: 11, seat_col: 16, seat_row: 12, facing: "up", style: "ww1_trench_map",      glow_color: "#facc15" }
  - { id: "w1-14", label: "Sopwith Camel Aerial Photo Bench", col: 19, row: 11, seat_col: 19, seat_row: 12, facing: "up", style: "ww1_biplane_rig",     glow_color: "#f59e0b" }
  - { id: "w1-15", label: "Somme Barrage Artillery Plotter",  col: 22, row: 11, seat_col: 22, seat_row: 12, facing: "up", style: "ww1_trench_map",      glow_color: "#ef4444" }
  - { id: "w1-16", label: "RFC Mahogany Propeller Rig",       col: 16, row: 14, seat_col: 16, seat_row: 15, facing: "up", style: "ww1_biplane_rig",     glow_color: "#eab308" }
  - { id: "w1-17", label: "Verdun Sector Zero-Hour Table",    col: 19, row: 14, seat_col: 19, seat_row: 15, facing: "up", style: "ww1_trench_map",      glow_color: "#84cc16" }
  - { id: "w1-18", label: "Observation Balloon Photo Box",    col: 22, row: 14, seat_col: 22, seat_row: 15, facing: "up", style: "ww1_biplane_rig",     glow_color: "#38bdf8" }

waypoints:
  - { id: "wp-tea",        col: 16, row: 3, activity: "coffee",      bubble: "☕ Pouring hot tin-mug trench tea & rum" }
  - { id: "wp-gramophone", col: 24, row: 3, activity: "arcade",      bubble: "🎶 Winding the brass-horn gramophone" }
  - { id: "wp-brazier-1",  col: 18, row: 6, activity: "lounge",      bubble: "🔥 Warming hands by the glowing coke brazier" }
  - { id: "wp-brazier-2",  col: 23, row: 6, activity: "lounge",      bubble: "✉️ Writing a letter home by candlelight" }
  - { id: "wp-zero-hour",  col: 13, row: 8, activity: "whiteboard",  bubble: "⏱️ Synchronizing trench watches for zero hour" }
  - { id: "wp-duck-1",     col: 7,  row: 8, activity: "lounge",      bubble: "🥾 Inspecting the wooden trench duckboards" }
  - { id: "wp-duck-2",     col: 19, row: 8, activity: "lounge",      bubble: "🌺 Admiring red Flanders poppies" }

props:
  - { id: "prop-rations",    type: "ww1_duckboard_crate", col: 15, row: 2,  w: 3, h: 1, label: "RUM & TEA", animated: true }
  - { id: "prop-gramophone", type: "ww1_gramophone",      col: 23, row: 2,  w: 2, h: 1, label: "78 RPM", animated: true }
  - { id: "prop-brazier",    type: "ww1_brazier_stove",   col: 17, row: 4,  w: 2, h: 1, label: "BRAZIER", animated: true }
  - { id: "prop-parapet",    type: "ww1_sandbag_parapet", col: 21, row: 5,  w: 3, h: 1, label: "PARAPET" }
  - { id: "prop-mortars",    type: "ww1_mortar_rack",     col: 25, row: 11, w: 2, h: 2, label: "18-PDR SHELLS" }
  - { id: "prop-wire",       type: "ww1_barbed_wire",     col: 25, row: 14, w: 2, h: 2, label: "WIRE STAKES" }
  - { id: "prop-zero-board", type: "ww1_trench_clock",    col: 4,  row: 0,  w: 4, h: 1, label: "ZERO HOUR" }
  - { id: "prop-poppy-1",    type: "ww1_poppy_planter",   col: 11, row: 1,  w: 1, h: 1, animated: true }
  - { id: "prop-poppy-2",    type: "ww1_poppy_planter",   col: 26, row: 1,  w: 1, h: 1, animated: true }
  - { id: "prop-poppy-3",    type: "ww1_poppy_planter",   col: 1,  row: 16, w: 1, h: 1, animated: true }

