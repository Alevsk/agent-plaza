    label: "SHODO CALLIGRAPHY & BONSAI HALL"
    color: "#f472b6"
    col: 1
    row: 1
    w: 11
    h: 7
  - id: "south_dojo"
    label: "KATANA SWORDSMITH & UKIYO-E WING"
    color: "#fb923c"
    col: 1
    row: 10
    w: 11
    h: 7
  - id: "east_sanctuary"
    label: "TEA CEREMONY & SHOGUN STRATEGY"
    color: "#38bdf8"
    col: 14
    row: 10
    w: 13
    h: 7
  - id: "zen_garden"
    label: "KARESANSUI ZEN GARDEN & KOI POND"
    color: "#4ade80"
