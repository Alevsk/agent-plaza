id: japanese
name: "Edo Sakura Dojo & Zen Garden"
description: "Traditional Japanese artisan sanctuary where agents forge katanas, paint shodo calligraphy, sculpt bonsai, whisk ceremonial matcha, carve ukiyo-e woodblocks, and meditate in the Zen rock garden & koi pond."
theme_badge: "⛩️ Edo Dojo"

theme:
  background: "#0c0d0e"
  wall_color: "#2b211e"
  wall_trim: "#854d0e"
  floor_primary: "#1a1f1c"
  floor_secondary: "#222921"
  floor_accent: "#1f271f"
  grid_line: "rgba(244, 114, 182, 0.06)"
  accent_color: "#f472b6"
  secondary_color: "#fb923c"
  spawn_effect: "smoke"
  spawn_color: "#f472b6"
  particles: "leaves"
  working_verb: "Practicing artisan craft"
  idle_verb: "Meditating in the Zen Garden"

grid:
  cols: 28
  rows: 18
  tile_size: 16
  layout:
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "W..........................W"
    - "W..........................W"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"

