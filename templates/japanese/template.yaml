    w: 13
    h: 7

workstations:
  # North Shodo Calligraphy & Bonsai Hall
  - { id: "tatami-1",  label: "Shodo Calligraphy & Inkstone", col: 2,  row: 2,  seat_col: 2,  seat_row: 3,  facing: "up", style: "dojo_calligraphy",  glow_color: "#f472b6" }
  - { id: "tatami-2",  label: "Sakura Bonsai Shaping Bench",  col: 5,  row: 2,  seat_col: 5,  seat_row: 3,  facing: "up", style: "dojo_bonsai",       glow_color: "#4ade80" }
  - { id: "tatami-3",  label: "Haiku Scroll & Brush Table",   col: 8,  row: 2,  seat_col: 8,  seat_row: 3,  facing: "up", style: "dojo_calligraphy",  glow_color: "#fb923c" }
  - { id: "tatami-4",  label: "Juniper Bonsai Artisan Table", col: 2,  row: 5,  seat_col: 2,  seat_row: 6,  facing: "up", style: "dojo_bonsai",       glow_color: "#38bdf8" }
  - { id: "tatami-5",  label: "Imperial Seal & Scroll Desk",  col: 5,  row: 5,  seat_col: 5,  seat_row: 6,  facing: "up", style: "dojo_calligraphy",  glow_color: "#f472b6" }
  - { id: "tatami-6",  label: "Ikebana Floral Arrangement",   col: 8,  row: 5,  seat_col: 8,  seat_row: 6,  facing: "up", style: "dojo_bonsai",       glow_color: "#facc15" }
  # South Katana Swordsmith & Ukiyo-e Woodblock Wing
  - { id: "tatami-7",  label: "Tamahagane Katana Forge",      col: 2,  row: 11, seat_col: 2,  seat_row: 12, facing: "up", style: "dojo_katana_forge", glow_color: "#fb923c" }
  - { id: "tatami-8",  label: "Ukiyo-e Woodblock Carving",    col: 5,  row: 11, seat_col: 5,  seat_row: 12, facing: "up", style: "dojo_woodblock",    glow_color: "#38bdf8" }
  - { id: "tatami-9",  label: "Blade Whetstone Polishing",    col: 8,  row: 11, seat_col: 8,  seat_row: 12, facing: "up", style: "dojo_katana_forge", glow_color: "#f472b6" }
  - { id: "tatami-10", label: "Great Wave Woodblock Press",   col: 2,  row: 14, seat_col: 2,  seat_row: 15, facing: "up", style: "dojo_woodblock",    glow_color: "#a855f7" }
  - { id: "tatami-11", label: "Wakizashi Hilt Wrapping",      col: 5,  row: 14, seat_col: 5,  seat_row: 15, facing: "up", style: "dojo_katana_forge", glow_color: "#fb923c" }
  - { id: "tatami-12", label: "Indigo Textile Dyeing Table",  col: 8,  row: 14, seat_col: 8,  seat_row: 15, facing: "up", style: "dojo_woodblock",    glow_color: "#38bdf8" }
  # East Tea Ceremony & Shogun Strategy
  - { id: "tatami-13", label: "Chashitsu Matcha Ceremony",    col: 16, row: 11, seat_col: 16, seat_row: 12, facing: "up", style: "dojo_tea_ceremony", glow_color: "#4ade80" }
  - { id: "tatami-14", label: "Shogun War-Fan Strategy Map",  col: 19, row: 11, seat_col: 19, seat_row: 12, facing: "up", style: "dojo_scroll_lectern", glow_color: "#f472b6" }
  - { id: "tatami-15", label: "Tetsubin Iron Kettle Mat",     col: 22, row: 11, seat_col: 22, seat_row: 12, facing: "up", style: "dojo_tea_ceremony", glow_color: "#facc15" }
  - { id: "tatami-16", label: "Go Board & Tactics Table",     col: 16, row: 14, seat_col: 16, seat_row: 15, facing: "up", style: "dojo_scroll_lectern", glow_color: "#38bdf8" }
  - { id: "tatami-17", label: "Sencha Steep & Whisk Mat",     col: 19, row: 14, seat_col: 19, seat_row: 15, facing: "up", style: "dojo_tea_ceremony", glow_color: "#4ade80" }
  - { id: "tatami-18", label: "Koto Zither & Poetry Desk",    col: 22, row: 14, seat_col: 22, seat_row: 15, facing: "up", style: "dojo_calligraphy",  glow_color: "#a855f7" }

