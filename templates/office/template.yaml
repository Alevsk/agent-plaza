id: office
name: "Pixel HQ Office"
description: "Cozy ZEP/Gather-style engineering HQ with diverse developer rigs (ultrawide, triple-monitor, standing desks, hardware benches), ping-pong game room, and espresso bar."
theme_badge: "🏢 Office"

theme:
  background: "#0d111a"
  wall_color: "#252d3d"
  wall_trim: "#3b4861"
  floor_primary: "#4a3828"
  floor_secondary: "#54402e"
  floor_accent: "#253447"
  grid_line: "rgba(255, 255, 255, 0.04)"
  accent_color: "#38bdf8"
  secondary_color: "#a855f7"
  spawn_effect: "matrix"
  spawn_color: "#22c55e"
  particles: "dust"
  working_verb: "Coding at workstation"
  idle_verb: "Hanging out in rec room"

grid:
  cols: 28
  rows: 18
  tile_size: 16
  layout:
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "W..........................W"
    - "W..........................W"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"

zones:
  - id: "north_coding_bay"
    label: "CORE ENGINEERING BAY"
    color: "#38bdf8"
    col: 1
    row: 1
    w: 11
    h: 7
  - id: "south_coding_bay"
    label: "DEVOPS & HARDWARE LAB"
    color: "#a855f7"
    col: 1
    row: 10
    w: 11
    h: 7
  - id: "east_ai_lab"
    label: "AI DESIGN & STUDIO WING"
    color: "#10b981"
    col: 14
    row: 10
    w: 13
    h: 7
  - id: "lounge"
    label: "REC ROOM & ESPRESSO BAR"
    color: "#f59e0b"
    col: 14
    row: 1
    w: 13
    h: 7

workstations:
  # North Coding Bay (Diverse setups: Triple Monitor, Ultrawide, Standing Desk, Laptop + Vertical, Mac Studio, Kanban Architect)
  - { id: "desk-1",  label: "Triple-Monitor Command Rig", col: 2,  row: 2,  seat_col: 2,  seat_row: 3,  facing: "up", style: "office_triple",       glow_color: "#38bdf8" }
  - { id: "desk-2",  label: "Curved Ultrawide & Laptop",  col: 5,  row: 2,  seat_col: 5,  seat_row: 3,  facing: "up", style: "office_ultrawide",    glow_color: "#f97316" }
  - { id: "desk-3",  label: "Elevated Standing Desk",     col: 8,  row: 2,  seat_col: 8,  seat_row: 3,  facing: "up", style: "office_standing",     glow_color: "#22c55e" }
  - { id: "desk-4",  label: "Creative Studio & Tablet",   col: 2,  row: 5,  seat_col: 2,  seat_row: 6,  facing: "up", style: "office_mac_studio",   glow_color: "#a855f7" }
  - { id: "desk-5",  label: "System Architect Kanban",    col: 5,  row: 5,  seat_col: 5,  seat_row: 6,  facing: "up", style: "office_architect",    glow_color: "#ec4899" }
  - { id: "desk-6",  label: "Dual-Screen Dev Station",    col: 8,  row: 5,  seat_col: 8,  seat_row: 6,  facing: "up", style: "desk_pc",             glow_color: "#eab308" }
  # South DevOps & Hardware Bay
  - { id: "desk-7",  label: "Hardware Oscilloscope Bench", col: 2,  row: 11, seat_col: 2,  seat_row: 12, facing: "up", style: "office_server_bench", glow_color: "#38bdf8" }
  - { id: "desk-8",  label: "Triple-Monitor SRE Rig",      col: 5,  row: 11, seat_col: 5,  seat_row: 12, facing: "up", style: "office_triple",       glow_color: "#22c55e" }
  - { id: "desk-9",  label: "Ultrawide Analytics Desk",    col: 8,  row: 11, seat_col: 8,  seat_row: 12, facing: "up", style: "office_ultrawide",    glow_color: "#f97316" }
  - { id: "desk-10", label: "Standing Treadmill Desk",     col: 2,  row: 14, seat_col: 2,  seat_row: 15, facing: "up", style: "office_standing",     glow_color: "#a855f7" }
  - { id: "desk-11", label: "Embedded Test Bench",         col: 5,  row: 14, seat_col: 5,  seat_row: 15, facing: "up", style: "office_server_bench", glow_color: "#06b6d4" }
  - { id: "desk-12", label: "Dual-Screen Security Rig",    col: 8,  row: 14, seat_col: 8,  seat_row: 15, facing: "up", style: "desk_pc",             glow_color: "#10b981" }
  # East AI & Studio Lab
  - { id: "desk-13", label: "Pro Display & Mac Studio",    col: 16, row: 11, seat_col: 16, seat_row: 12, facing: "up", style: "office_mac_studio",   glow_color: "#38bdf8" }
  - { id: "desk-14", label: "Ultrawide Training Console",  col: 19, row: 11, seat_col: 19, seat_row: 12, facing: "up", style: "office_ultrawide",    glow_color: "#f43f5e" }
  - { id: "desk-15", label: "Product Kanban Station",      col: 22, row: 11, seat_col: 22, seat_row: 12, facing: "up", style: "office_architect",    glow_color: "#eab308" }
  - { id: "desk-16", label: "Triple-Screen Model Lab",     col: 16, row: 14, seat_col: 16, seat_row: 15, facing: "up", style: "office_triple",       glow_color: "#10b981" }
  - { id: "desk-17", label: "Standing Research Desk",      col: 19, row: 14, seat_col: 19, seat_row: 15, facing: "up", style: "office_standing",     glow_color: "#8b5cf6" }
  - { id: "desk-18", label: "Hardware GPU Test Bench",     col: 22, row: 14, seat_col: 22, seat_row: 15, facing: "up", style: "office_server_bench", glow_color: "#06b6d4" }

