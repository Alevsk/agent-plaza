  - { id: "wp-radar",   col: 24, row: 3, activity: "arcade",      bubble: "📡 Checking rotating radar mast" }
  - { id: "wp-map",     col: 19, row: 5, activity: "lounge",      bubble: "🗺️ Moving squadron markers on map" }
