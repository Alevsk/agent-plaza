id: ww2
name: "Allied Cipher Bunker & Motor Pool"
description: "WW2 command complex with Enigma rotor desks, spinning Turing Bombe drums, rotating PPI radar scopes, shortwave Morse rigs, engine repair benches, and a sandbagged observation post."
theme_badge: "🎖️ WW2 Bunker"

theme:
  background: "#0b0f0c"
  wall_color: "#263028"
  wall_trim: "#4d5e4f"
  floor_primary: "#1e2420"
  floor_secondary: "#242b26"
  floor_accent: "#2d3830"
  grid_line: "rgba(132, 204, 22, 0.05)"
  accent_color: "#84cc16"
  secondary_color: "#eab308"
  spawn_effect: "beam"
  spawn_color: "#84cc16"
  particles: "dust"
  working_verb: "Operating bunker station"
  idle_verb: "On watch at the command post"

grid:
  cols: 28
  rows: 18
  tile_size: 16
  layout:
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "W..........................W"
    - "W..........................W"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"

