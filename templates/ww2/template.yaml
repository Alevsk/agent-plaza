    label: "HUT 8 ENIGMA & BOMBE HALL"
    color: "#84cc16"
    col: 1
    row: 1
    w: 11
    h: 7
  - id: "signals_corps"
    label: "RADAR & SHORTWAVE INTERCEPT"
    color: "#eab308"
    col: 1
    row: 10
    w: 11
    h: 7
  - id: "motor_pool"
    label: "MOTOR POOL & AIR PLOTTERS"
    color: "#22c55e"
    col: 14
