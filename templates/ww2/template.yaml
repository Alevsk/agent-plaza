workstations:
  # North Hut 8 Enigma & Turing Bombe Hall
  - { id: "radio-1",  label: "Enigma M4 Rotor Cipher Desk",  col: 2,  row: 2,  seat_col: 2,  seat_row: 3,  facing: "up", style: "ww2_enigma",         glow_color: "#84cc16" }
  - { id: "radio-2",  label: "Turing Bombe Spinning Drums",  col: 5,  row: 2,  seat_col: 5,  seat_row: 3,  facing: "up", style: "ww2_bombe_drum",     glow_color: "#eab308" }
  - { id: "radio-3",  label: "Naval Lorenz Cipher Teletype", col: 8,  row: 2,  seat_col: 8,  seat_row: 3,  facing: "up", style: "ww2_enigma",         glow_color: "#22c55e" }
  - { id: "radio-4",  label: "Bombe Bank B Rotor Rack",      col: 2,  row: 5,  seat_col: 2,  seat_row: 6,  facing: "up", style: "ww2_bombe_drum",     glow_color: "#84cc16" }
  - { id: "radio-5",  label: "Codebook Crib Analysis Desk",  col: 5,  row: 5,  seat_col: 5,  seat_row: 6,  facing: "up", style: "ww2_enigma",         glow_color: "#f97316" }
  - { id: "radio-6",  label: "Colossus Paper-Tape Reader",   col: 8,  row: 5,  seat_col: 8,  seat_row: 6,  facing: "up", style: "ww2_bombe_drum",     glow_color: "#eab308" }
  # South Radar & Shortwave Intercept
  - { id: "radio-7",  label: "Chain Home PPI Radar Scope",   col: 2,  row: 11, seat_col: 2,  seat_row: 12, facing: "up", style: "ww2_radar_scope",    glow_color: "#22c55e" }
  - { id: "radio-8",  label: "Shortwave Morse Transceiver",  col: 5,  row: 11, seat_col: 5,  seat_row: 12, facing: "up", style: "ww2_radio_morse",    glow_color: "#eab308" }
  - { id: "radio-9",  label: "Coastal Defense Radar CRT",    col: 8,  row: 11, seat_col: 8,  seat_row: 12, facing: "up", style: "ww2_radar_scope",    glow_color: "#84cc16" }
  - { id: "radio-10", label: "HF Direction-Finding Rig",     col: 2,  row: 14, seat_col: 2,  seat_row: 15, facing: "up", style: "ww2_radio_morse",    glow_color: "#f97316" }
  - { id: "radio-11", label: "Night-Fighter Intercept CRT",  col: 5,  row: 14, seat_col: 5,  seat_row: 15, facing: "up", style: "ww2_radar_scope",    glow_color: "#22c55e" }
  - { id: "radio-12", label: "Field Telegraph & Wire Reel",  col: 8,  row: 14, seat_col: 8,  seat_row: 15, facing: "up", style: "ww2_radio_morse",    glow_color: "#84cc16" }
  # East Motor Pool & Air Defense Plotters
  - { id: "radio-13", label: "Spitfire Merlin Engine Bench", col: 16, row: 11, seat_col: 16, seat_row: 12, facing: "up", style: "ww2_field_mechanic", glow_color: "#f97316" }
  - { id: "radio-14", label: "Sector Operations Plot Table", col: 19, row: 11, seat_col: 19, seat_row: 12, facing: "up", style: "ww2_map_plotter",    glow_color: "#84cc16" }
  - { id: "radio-15", label: "Willys Jeep Gearbox Bench",    col: 22, row: 11, seat_col: 22, seat_row: 12, facing: "up", style: "ww2_field_mechanic", glow_color: "#eab308" }
  - { id: "radio-16", label: "Convoy Sonar & Chart Table",   col: 16, row: 14, seat_col: 16, seat_row: 15, facing: "up", style: "ww2_map_plotter",    glow_color: "#22c55e" }
  - { id: "radio-17", label: "Avionics & Magneto Workbench", col: 19, row: 14, seat_col: 19, seat_row: 15, facing: "up", style: "ww2_field_mechanic", glow_color: "#84cc16" }
  - { id: "radio-18", label: "Bomber Wing Recon Plotter",    col: 22, row: 14, seat_col: 22, seat_row: 15, facing: "up", style: "ww2_map_plotter",    glow_color: "#eab308" }

