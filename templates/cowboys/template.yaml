id: cowboys
name: "Wild West Frontier Ranch & Forge"
description: "Frontier ranch where agents groom & saddle horses, hammer glowing iron at the blacksmith anvil, pan for gold, craft leather saddles, and relax around the campfire & saloon piano."
theme_badge: "🤠 Cowboys"

theme:
  background: "#0d0907"
  wall_color: "#382214"
  wall_trim: "#78472a"
  floor_primary: "#211712"
  floor_secondary: "#261b15"
  floor_accent: "#1e1510"
  grid_line: "rgba(251, 191, 36, 0.05)"
  accent_color: "#f59e0b"
  secondary_color: "#ea580c"
  spawn_effect: "smoke"
  spawn_color: "#f59e0b"
  particles: "dust"
  working_verb: "Working the frontier ranch"
  idle_verb: "Resting by the campfire & saloon"

