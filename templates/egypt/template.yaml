  # North House of Life Papyrus Scriptorium
  - { id: "eg-1",  label: "Royal Papyrus & Reed-Brush Desk",  col: 2,  row: 2,  seat_col: 2,  seat_row: 3,  facing: "up", style: "egypt_papyrus_desk",    glow_color: "#facc15" }
  - { id: "eg-2",  label: "Rosetta Cartouche Stele Chisel",   col: 5,  row: 2,  seat_col: 5,  seat_row: 3,  facing: "up", style: "egypt_hieroglyph_wall", glow_color: "#38bdf8" }
  - { id: "eg-3",  label: "Book of Thoth Illumination Table", col: 8,  row: 2,  seat_col: 8,  seat_row: 3,  facing: "up", style: "egypt_papyrus_desk",    glow_color: "#f59e0b" }
  - { id: "eg-4",  label: "Karnak Obelisk Relief Bench",      col: 2,  row: 5,  seat_col: 2,  seat_row: 6,  facing: "up", style: "egypt_hieroglyph_wall", glow_color: "#eab308" }
  - { id: "eg-5",  label: "Nile Flood Nilometer Ledger",      col: 5,  row: 5,  seat_col: 5,  seat_row: 6,  facing: "up", style: "egypt_papyrus_desk",    glow_color: "#06b6d4" }
  - { id: "eg-6",  label: "Sacred Ankh Glyph Scriptorium",    col: 8,  row: 5,  seat_col: 8,  seat_row: 6,  facing: "up", style: "egypt_hieroglyph_wall", glow_color: "#facc15" }
  # South Aten Sun-Disk & Astronomy Altar
  - { id: "eg-7",  label: "Levitating Aten Sun-Disk Altar",   col: 2,  row: 11, seat_col: 2,  seat_row: 12, facing: "up", style: "egypt_sun_altar",       glow_color: "#facc15" }
  - { id: "eg-8",  label: "Dendera Zodiac Star-Disk Table",   col: 5,  row: 11, seat_col: 5,  seat_row: 12, facing: "up", style: "egypt_astronomer",      glow_color: "#38bdf8" }
  - { id: "eg-9",  label: "Ra Solar Barque Shrine",           col: 8,  row: 11, seat_col: 8,  seat_row: 12, facing: "up", style: "egypt_sun_altar",       glow_color: "#f59e0b" }
  - { id: "eg-10", label: "Sirius Heliacal Merkhet Sight",    col: 2,  row: 14, seat_col: 2,  seat_row: 15, facing: "up", style: "egypt_astronomer",      glow_color: "#818cf8" }
  - { id: "eg-11", label: "Horizon of Giza Alignment Altar",  col: 5,  row: 14, seat_col: 5,  seat_row: 15, facing: "up", style: "egypt_sun_altar",       glow_color: "#facc15" }
  - { id: "eg-12", label: "Celestial Water-Clock Clepsydra",  col: 8,  row: 14, seat_col: 8,  seat_row: 15, facing: "up", style: "egypt_astronomer",      glow_color: "#06b6d4" }
  # East Lapis Jewelry & Canopic Alchemy
  - { id: "eg-13", label: "Lapis-Lazuli & Gold Collar Forge", col: 16, row: 11, seat_col: 16, seat_row: 12, facing: "up", style: "egypt_jeweler",         glow_color: "#38bdf8" }
  - { id: "eg-14", label: "Alabaster Canopic Alchemy Bench",  col: 19, row: 11, seat_col: 19, seat_row: 12, facing: "up", style: "egypt_canopic_bench",   glow_color: "#22c55e" }
  - { id: "eg-15", label: "Winged Scarab Electrum Goldsmith", col: 22, row: 11, seat_col: 22, seat_row: 12, facing: "up", style: "egypt_jeweler",         glow_color: "#facc15" }
  - { id: "eg-16", label: "Kyphi Sacred Incense Distiller",   col: 16, row: 14, seat_col: 16, seat_row: 15, facing: "up", style: "egypt_canopic_bench",   glow_color: "#f59e0b" }
  - { id: "eg-17", label: "Carnelian Eye-of-Horus Inlay",     col: 19, row: 14, seat_col: 19, seat_row: 15, facing: "up", style: "egypt_jeweler",         glow_color: "#ef4444" }
  - { id: "eg-18", label: "Blue Lotus Elixir Apothecary",     col: 22, row: 14, seat_col: 22, seat_row: 15, facing: "up", style: "egypt_canopic_bench",   glow_color: "#06b6d4" }

