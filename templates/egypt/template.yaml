id: egypt
name: "Pharaoh's Pyramid & Sun-Disk Temple"
description: "Golden limestone pyramid sanctuary where royal scribes illuminate Nile papyrus scrolls, channel the levitating Aten sun-disk, craft lapis-lazuli collars, chart constellations, and rest beside the lotus oasis."
theme_badge: "🏛️ Egypt"

theme:
  background: "#0d0905"
  wall_color: "#4d351b"
  wall_trim: "#9a6b32"
  floor_primary: "#241b12"
  floor_secondary: "#2a2016"
  floor_accent: "#1e160f"
  grid_line: "rgba(250, 204, 21, 0.05)"
  accent_color: "#facc15"
  secondary_color: "#38bdf8"
  spawn_effect: "beam"
  spawn_color: "#facc15"
  particles: "sand"
  exterior: "sand"
  working_verb: "Inscribing sacred pyramid hieroglyphs"
  idle_verb: "Cooling off by the sacred Nile oasis"

grid:
  cols: 28
  rows: 18
  tile_size: 16
  layout:
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "W..........................W"
    - "W..........................W"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"

zones:
