    label: "HOUSE OF LIFE PAPYRUS SCRIPTORIUM"
    color: "#facc15"
    col: 1
    row: 1
    w: 11
    h: 7
  - id: "sun_sanctuary"
    label: "ATEN SUN-DISK & ASTRONOMY ALTAR"
    color: "#f59e0b"
    col: 1
    row: 10
    w: 11
    h: 7
  - id: "royal_treasury"
    label: "LAPIS JEWELRY & CANOPIC ALCHEMY"
    color: "#38bdf8"
    col: 14
    row: 10
    w: 13
    h: 7
  - id: "lotus_oasis"
    label: "SACRED NILE OASIS & SPHINX COURT"
    color: "#22c55e"
    col: 14
    row: 1
    w: 13
    h: 7

