id: pirates
name: "Crimson Galleon & Smuggler's Cove"
description: "High-seas pirate galleon where agents plot treasure charts, steer the quarterdeck helm, prime 24-pounder cannons, distill spiced rum elixirs, and toast grog by the overflowing treasure chest."
theme_badge: "🏴‍☠️ Pirates"

theme:
  background: "#070c14"
  wall_color: "#3b2313"
  wall_trim: "#7c4a27"
  floor_primary: "#24170f"
  floor_secondary: "#291a11"
  floor_accent: "#1e130c"
  grid_line: "rgba(250, 204, 21, 0.05)"
  accent_color: "#f59e0b"
  secondary_color: "#ef4444"
  spawn_effect: "smoke"
  spawn_color: "#facc15"
  particles: "sea_spray"
  exterior: "ocean"
  working_verb: "Sailing the Crimson Galleon"
  idle_verb: "Swigging grog on the quarterdeck"

grid:
  cols: 28
  rows: 18
  tile_size: 16
  layout:
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCCWWLLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "WCCCCCCCCCCC..LLLLLLLLLLLLLW"
    - "W..........................W"
    - "W..........................W"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCC..CCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WCCCCCCCCCCCWWCCCCCCCCCCCCCW"
    - "WWWWWWWWWWWWWWWWWWWWWWWWWWWW"

zones:
  - id: "navigation_cabin"
    label: "CAPTAIN'S CHART & HELM DECK"
    color: "#f59e0b"
    col: 1
    row: 1
    w: 11
    h: 7
  - id: "gun_deck"
    label: "BROADSIDE CANNON & POWDER BAY"
    color: "#ef4444"
    col: 1
    row: 10
    w: 11
    h: 7
  - id: "smuggler_hold"
    label: "SHIPWRIGHT & RUM ALCHEMY HOLD"
    color: "#10b981"
    col: 14
    row: 10
    w: 13
    h: 7
  - id: "grog_tavern"
    label: "SMUGGLER'S GROG & TREASURE LOUNGE"
    color: "#eab308"
    col: 14
    row: 1
    w: 13
    h: 7

workstations:
  # North Captain's Chart & Helm Deck
  - { id: "pr-1",  label: "Treasure Map & Compass Table",  col: 2,  row: 2,  seat_col: 2,  seat_row: 3,  facing: "up", style: "pirate_chart_table",  glow_color: "#f59e0b" }
  - { id: "pr-2",  label: "Quarterdeck Mahogany Helm",     col: 5,  row: 2,  seat_col: 5,  seat_row: 3,  facing: "up", style: "pirate_helm",         glow_color: "#eab308" }
  - { id: "pr-3",  label: "Celestial Sextant & Chronometer", col: 8, row: 2, seat_col: 8,  seat_row: 3,  facing: "up", style: "pirate_chronometer",  glow_color: "#38bdf8" }
  - { id: "pr-4",  label: "Spanish Main Cartography Desk", col: 2,  row: 5,  seat_col: 2,  seat_row: 6,  facing: "up", style: "pirate_chart_table",  glow_color: "#ef4444" }
  - { id: "pr-5",  label: "Crow's Nest Lookouts Wheel",    col: 5,  row: 5,  seat_col: 5,  seat_row: 6,  facing: "up", style: "pirate_helm",         glow_color: "#f59e0b" }
  - { id: "pr-6",  label: "Privateer Letter-of-Marque Desk", col: 8, row: 5, seat_col: 8,  seat_row: 6,  facing: "up", style: "pirate_chronometer",  glow_color: "#22c55e" }
  # South Broadside Cannon & Powder Bay
  - { id: "pr-7",  label: "24-Pounder Broadside Cannon",   col: 2,  row: 11, seat_col: 2,  seat_row: 12, facing: "up", style: "pirate_cannon_deck",  glow_color: "#ef4444" }
  - { id: "pr-8",  label: "Starboard Culverin Battery",    col: 5,  row: 11, seat_col: 5,  seat_row: 12, facing: "up", style: "pirate_cannon_deck",  glow_color: "#f97316" }
  - { id: "pr-9",  label: "Gunner's Powder & Fuse Bench",  col: 8,  row: 11, seat_col: 8,  seat_row: 12, facing: "up", style: "pirate_carpenter",    glow_color: "#eab308" }
  - { id: "pr-10", label: "Bow Chaser Swivel Cannon",      col: 2,  row: 14, seat_col: 2,  seat_row: 15, facing: "up", style: "pirate_cannon_deck",  glow_color: "#ef4444" }
  - { id: "pr-11", label: "Chain-Shot Ordnance Carriage",  col: 5,  row: 14, seat_col: 5,  seat_row: 15, facing: "up", style: "pirate_cannon_deck",  glow_color: "#f59e0b" }
  - { id: "pr-12", label: "Flintlock & Cutlass Armory",    col: 8,  row: 14, seat_col: 8,  seat_row: 15, facing: "up", style: "pirate_carpenter",    glow_color: "#38bdf8" }
  # East Shipwright & Rum Alchemy Hold
  - { id: "pr-13", label: "Copper Spiced-Rum Alembic",     col: 16, row: 11, seat_col: 16, seat_row: 12, facing: "up", style: "pirate_alchemy_rum",  glow_color: "#10b981" }
  - { id: "pr-14", label: "Shipwright Hull Model Bench",   col: 19, row: 11, seat_col: 19, seat_row: 12, facing: "up", style: "pirate_carpenter",    glow_color: "#f59e0b" }
  - { id: "pr-15", label: "Sea-Glass Elixir Still",        col: 22, row: 11, seat_col: 22, seat_row: 12, facing: "up", style: "pirate_alchemy_rum",  glow_color: "#a855f7" }
  - { id: "pr-16", label: "Rigging & Rope Splicing Vise",  col: 16, row: 14, seat_col: 16, seat_row: 15, facing: "up", style: "pirate_carpenter",    glow_color: "#eab308" }
  - { id: "pr-17", label: "Plunder Doubloon Assay Table",  col: 19, row: 14, seat_col: 19, seat_row: 15, facing: "up", style: "pirate_chart_table",  glow_color: "#facc15" }
  - { id: "pr-18", label: "Kraken Venom Apothecary",       col: 22, row: 14, seat_col: 22, seat_row: 15, facing: "up", style: "pirate_alchemy_rum",  glow_color: "#06b6d4" }

waypoints:
  - { id: "wp-grog",     col: 16, row: 3, activity: "coffee",      bubble: "🍺 Pouring a tankard of spiced grog" }
  - { id: "wp-treasure", col: 23, row: 3, activity: "arcade",      bubble: "🪙 Counting Spanish gold doubloons" }
  - { id: "wp-chest-1",  col: 18, row: 5, activity: "lounge",      bubble: "🏴‍☠️ Singing a sea shanty!" }
